<style id="card-style">/* Layout: one-screen stage; five scenes stacked in place and swapped like pages of a pop-up card; content column max 460px */
:root{
  --bg:#FFD3DF; --night:#2B1520; --ink:#4A2420; --ink-soft:#8A5149; --paper:#FFFBF4; --cream:#FFE9D2;
  --cherry:#F0386B; --cherry-dark:#C41F4E; --butter:#FFD45C; --mint:#7DDCC0; --sky:#86C8FF; --lilac:#C6A8FF; --tangerine:#FF9F5A; --pink:#FF8FB3;
  --display:"DynaPuff", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --hand:"Patrick Hand", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive;
  color-scheme: light;
}
html{height:100%; box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--display); -webkit-tap-highlight-color:transparent; transition:background-color .9s ease}
body.dark{--bg:var(--night)}
body.instant, body.instant *{transition:none !important}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--sky); outline-offset:3px; border-radius:12px}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

#bg,#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; display:block}
#bg{z-index:0; transition:opacity .9s ease}
body.dark #bg{opacity:.12}
#fx{z-index:40}
#app{position:relative; z-index:1; height:100%}

/* top bar: bunting doubles as the progress tracker */
.topbar{position:fixed; top:0; left:0; right:0; z-index:30; display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 6px); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); pointer-events:none}
.topbar > *{pointer-events:auto}
.bunting{grid-column:2; width:min(52vw, 220px); height:auto; display:block; overflow:visible; pointer-events:none}
.bunting .string{fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linecap:round; transition:stroke .9s}
body.dark .bunting .string{stroke:var(--cream)}
.bunting .flag-g{transform-box:fill-box; transform-origin:50% 0; transform:rotate(var(--a))}
.bunting .flag-g.now{animation:flutter 1.4s ease-in-out infinite}
.bunting .flag{fill:var(--paper); stroke:var(--ink); stroke-width:2.5; stroke-linejoin:round; transition:fill .5s}
.bunting .flag.on{fill:var(--fc)}
@keyframes flutter{0%,100%{transform:rotate(var(--a))} 50%{transform:rotate(calc(var(--a) + 9deg))}}
.icon-btn{grid-column:3; justify-self:end; width:44px; height:44px; border-radius:50%; border:2.5px solid var(--ink); background:var(--paper); display:grid; place-items:center; box-shadow:0 3px 0 var(--ink); cursor:pointer; padding:0}
.icon-btn svg{width:22px; height:22px; display:block}
.icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink)}
.edit-btn{grid-column:1; grid-row:1; justify-self:start; display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 14px 0 11px; border-radius:999px; border:2.5px solid var(--ink); background:var(--butter); font:600 14px/1 var(--display); box-shadow:0 3px 0 var(--ink); cursor:pointer}
.edit-btn svg{width:16px; height:16px}
.edit-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink)}

/* scenes */
.scene{position:absolute; inset:0; display:flex; flex-direction:column; overflow-x:hidden; overflow-y:auto;
  padding-block:64px 22px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  opacity:0; visibility:hidden; transform:translateY(18px) scale(.98); transition:opacity .5s ease, transform .5s ease, visibility 0s linear .5s}
.scene.on{opacity:1; visibility:visible; transform:none; transition:opacity .55s ease .2s, transform .6s cubic-bezier(.2,.8,.2,1) .2s, visibility 0s}
.stack{margin:auto; width:100%; max-width:460px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center}
.eyebrow{margin:0; font:600 13px/1 var(--display); letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft)}
.title{margin:0; font:700 clamp(30px, 8.6vw, 42px)/1.08 var(--display); color:var(--ink); text-wrap:balance; overflow-wrap:anywhere; text-shadow:0 3px 0 rgba(255,255,255,.7); transition:color .6s, text-shadow .6s}
.title:focus{outline:none}
.title.small{font-size:clamp(26px, 7vw, 34px)}
body.dark .scene-cake .title{color:var(--cream); text-shadow:0 2px 16px rgba(255,190,110,.4)}
body.dark .scene-cake .hint{color:#EBC3B2}
.hint{margin:0; max-width:30ch; font:400 clamp(19px, 5vw, 22px)/1.3 var(--hand); color:var(--ink-soft); text-wrap:balance; transition:color .6s, opacity .4s}
.word{display:inline-block; white-space:nowrap}
.ch{display:inline-block; animation:pop-in .6s cubic-bezier(.3,1.6,.5,1) both; animation-delay:calc(var(--i) * 45ms)}
@keyframes pop-in{0%{transform:translateY(24px) scale(.3); opacity:0} 100%{transform:none; opacity:1}}
.pill{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--paper); border:2px solid var(--ink); font:600 13px/1 var(--display); font-variant-numeric:tabular-nums}

.btn{appearance:none; border:2.5px solid var(--ink); border-radius:999px; background:var(--cherry); color:#fff; font:600 17px/1 var(--display); padding:14px 22px 14px 24px; box-shadow:0 4px 0 var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:transform .12s, box-shadow .12s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn.quiet{background:var(--paper); color:var(--ink)}
.btn svg{width:18px; height:18px; flex:none}
.reveal-later{opacity:0; visibility:hidden; transform:translateY(10px) scale(.92); transition:opacity .45s, transform .5s cubic-bezier(.3,1.5,.5,1), visibility 0s linear .5s}
.reveal-later.show{opacity:1; visibility:visible; transform:none; transition:opacity .45s, transform .5s cubic-bezier(.3,1.5,.5,1), visibility 0s}
.reveal-later.show:active{transform:translateY(3px)}

/* scene 1: envelope */
.env-wrap{width:min(86vw, 360px); margin-top:clamp(36px, 12vh, 96px)}
.envelope{position:relative; display:block; width:100%; aspect-ratio:3/2; padding:0; border:0; background:none; cursor:pointer; perspective:900px; animation:env-float 3.4s ease-in-out infinite; border-radius:14px}
@keyframes env-float{0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-8px) rotate(1.5deg)}}
.envelope.opening{animation:none; transform:none; transition:transform .3s; cursor:default}
.envelope > *{position:absolute}
.env-back,.env-pocket,.env-flap{inset:0; width:100%; height:100%; overflow:visible; display:block}
.env-back{z-index:0}
.env-letter{z-index:2; left:8%; right:8%; top:7%; height:82%; border:2.5px solid var(--ink); border-radius:10px; display:grid; align-content:start; justify-items:center; padding-top:9%;
  background:radial-gradient(circle at 14% 18%, var(--sky) 0 3px, transparent 3.5px), radial-gradient(circle at 86% 26%, var(--butter) 0 3px, transparent 3.5px), radial-gradient(circle at 22% 52%, var(--mint) 0 3px, transparent 3.5px), radial-gradient(circle at 80% 56%, var(--lilac) 0 3px, transparent 3.5px), var(--paper);
  transition:transform .85s cubic-bezier(.2,.9,.25,1.12)}
.env-letter .peek{display:block; width:34%}
.env-letter .peek svg{display:block; width:100%; height:auto}
.env-stack{transition:opacity .5s ease, transform .6s cubic-bezier(.5,0,.3,1)}
.scene-env.revealed .env-stack{opacity:0; transform:translateY(46px) scale(.9); pointer-events:none}
/* the greeting card that pops out of the envelope */
.greeting{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding-block:84px 24px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); visibility:hidden; pointer-events:none}
.scene-env.revealed .greeting{visibility:visible; pointer-events:auto}
.greet-card{position:relative; width:min(84vw, 340px); padding:60px 18px 26px; text-align:center; border:2.5px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink);
  background:radial-gradient(circle at 12% 16%, var(--sky) 0 4px, transparent 4.5px), radial-gradient(circle at 88% 12%, var(--mint) 0 4px, transparent 4.5px), radial-gradient(circle at 9% 84%, var(--lilac) 0 4px, transparent 4.5px), radial-gradient(circle at 91% 88%, var(--tangerine) 0 4px, transparent 4.5px), radial-gradient(circle at 86% 50%, var(--pink) 0 3px, transparent 3.5px), radial-gradient(circle at 14% 48%, var(--butter) 0 3px, transparent 3.5px), var(--paper);
  opacity:0; transform:translateY(90px) scale(.4) rotate(6deg); transition:transform .9s cubic-bezier(.2,1.35,.35,1), opacity .35s}
.scene-env.revealed .greet-card{opacity:1; transform:rotate(-2deg); transition-delay:.12s}
.greet-flower{position:absolute; left:50%; top:0; width:96px; margin-left:-48px; transform:translateY(-56%)}
.greet-flower svg{display:block; width:100%; height:auto; animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(9deg)}}
.g-line{margin:0; opacity:0}
.scene-env.revealed .g-line{animation:pop-in .7s cubic-bezier(.3,1.6,.5,1) both; animation-delay:calc(.55s + var(--i) * .18s)}
.g-happy{font:700 clamp(30px, 9.5vw, 42px)/1 var(--display); color:var(--cherry)}
.g-bday{font:700 clamp(38px, 12.5vw, 56px)/1.04 var(--display); color:var(--ink); text-shadow:0 4px 0 var(--butter)}
.g-name{margin-top:10px; font:400 clamp(42px, 13vw, 60px)/1.05 var(--hand); color:var(--ink); overflow-wrap:anywhere}
.g-name span{padding:0 10px; border-radius:6px; background:linear-gradient(transparent 56%, rgba(255,212,92,.95) 56% 88%, transparent 88%)}
.g-from{margin-top:14px; font:400 21px/1.2 var(--hand); color:var(--ink-soft)}
.env-pocket{z-index:3}
.env-flap{z-index:4; transform-origin:50% 2%; transition:transform .6s cubic-bezier(.45,0,.2,1)}
.seal{z-index:5; left:50%; top:60.5%; width:21%; aspect-ratio:1; transform:translate(-50%,-50%); transition:transform .35s cubic-bezier(.5,-.6,.5,1.6), opacity .3s .05s}
.seal svg{width:100%; height:100%; display:block; overflow:visible; animation:seal-pulse 1.8s ease-in-out infinite}
@keyframes seal-pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.08)}}
.envelope.opening .seal{transform:translate(-50%,-50%) scale(1.5) rotate(30deg); opacity:0}
.envelope.flap-open .env-flap{transform:rotateX(180deg)}
.envelope.flap-behind .env-flap{z-index:1}
.envelope.letter-out .env-letter{transform:translateY(-60%)}
.env-to{z-index:6; left:7%; bottom:10%; max-width:50%; display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left; pointer-events:none;
  background:var(--paper); border:2px solid var(--ink); border-radius:10px; padding:5px 12px 7px; transform:rotate(-3deg); box-shadow:0 3px 0 rgba(74,36,32,.25)}
.env-to small{font:400 17px/1 var(--hand); color:var(--ink-soft)}
.env-to b{font:700 clamp(18px, 5.4vw, 24px)/1.05 var(--display); color:var(--ink); overflow-wrap:anywhere}
.stamp{z-index:6; right:6%; bottom:9%; width:16%; transform:rotate(6deg); pointer-events:none}
.postmark{z-index:7; right:3%; bottom:32%; width:28%; transform:rotate(-12deg); color:rgba(74,36,32,.5); pointer-events:none}
.stamp svg,.postmark svg{display:block; width:100%; height:auto; overflow:visible}
.stamp text,.postmark text{font-family:var(--display); font-weight:700}

/* scene 2: cake (lights go down while the candles burn) */
.cake-wrap{--cw:min(78vw, 300px, 44vh); --k:calc(var(--cw) / 300); position:relative; width:var(--cw); height:calc(var(--k) * 320); touch-action:none; user-select:none; -webkit-user-select:none}
.cake-glow{position:absolute; left:50%; top:28%; width:150%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; opacity:0; transition:opacity .7s;
  background:radial-gradient(circle, rgba(255,198,112,.5) 0, rgba(255,170,90,.18) 34%, rgba(255,170,90,0) 62%)}
body.dark .cake-glow{opacity:var(--lit,1)}
.cake-svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; transition:filter .7s ease}
body.dark .cake-svg{filter:brightness(var(--bright,.8)) saturate(.9)}
.cake-svg .yay{opacity:0} .cake-wrap.happy .cake-svg .yay{opacity:1} .cake-wrap.happy .cake-svg .wish{opacity:0}
.candle{position:absolute; left:calc(var(--x) * var(--k)); top:calc(var(--y) * var(--k)); width:calc(26 * var(--k)); height:calc((var(--h) + 36) * var(--k)); transform:translate(-50%,-100%); padding:0; border:0; background:none; cursor:pointer; display:block; border-radius:8px}
.candle .stick{position:absolute; bottom:0; left:50%; width:calc(11 * var(--k)); height:calc(var(--h) * var(--k)); transform:translateX(-50%); border:2px solid var(--ink); border-radius:3px 3px 1px 1px;
  background:repeating-linear-gradient(-55deg, var(--c) 0 calc(4 * var(--k)), #fff calc(4 * var(--k)) calc(8 * var(--k)))}
.candle .wick{position:absolute; left:50%; bottom:calc(var(--h) * var(--k) - 1px); width:2px; height:calc(6 * var(--k)); margin-left:-1px; background:var(--ink); border-radius:1px}
.candle .flame{position:absolute; left:50%; bottom:calc((var(--h) + 4) * var(--k)); width:calc(14 * var(--k)); height:calc(22 * var(--k)); margin-left:calc(-7 * var(--k));
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%; background:radial-gradient(ellipse at 50% 78%, #FFFBE8 0 22%, #FFE27A 44%, #FFA94D 74%, #FF7A3D 100%);
  box-shadow:0 0 calc(12 * var(--k)) calc(4 * var(--k)) rgba(255,190,90,.5); transform-origin:50% 90%;
  animation:ignite .45s cubic-bezier(.3,1.7,.5,1) both, flicker var(--d,1.1s) ease-in-out .45s infinite; transition:transform .25s, opacity .25s}
@keyframes ignite{0%{transform:scale(0) translateY(6px)} 100%{transform:scale(1)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)} 30%{transform:scale(1.07,.93) rotate(2.5deg)} 55%{transform:scale(.94,1.08) rotate(-1deg)} 80%{transform:scale(1.03,.97) rotate(1.5deg)}}
.candle.unlit .flame,.candle.out .flame{animation:none; transform:scale(0) translateY(4px); opacity:0}
.candle.out{cursor:default}
.candle .smoke{position:absolute; left:50%; bottom:calc((var(--h) + 6) * var(--k)); width:calc(9 * var(--k)); height:calc(9 * var(--k)); margin-left:calc(-4.5 * var(--k)); border-radius:50%; background:rgba(210,190,184,.75); opacity:0; pointer-events:none}
.candle .smoke::after{content:""; position:absolute; inset:0; border-radius:50%; background:inherit; opacity:0}
.candle.out .smoke,.candle.out .smoke::after{animation:smoke 1.9s ease-out forwards}
.candle.out .smoke::after{animation-delay:.3s}
@keyframes smoke{0%{opacity:.85; transform:translate(0,0) scale(.6)} 100%{opacity:0; transform:translate(calc(8 * var(--k)), calc(-56 * var(--k))) scale(2.6)}}

/* scene 3: balloons */
.balloon-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; width:100%; max-width:420px; margin-top:4px}
.cell{position:relative; height:clamp(138px, 21vh, 168px); display:grid; place-items:center}
.balloon{position:relative; width:min(100%, 84px); height:100%; padding:0; border:0; background:none; cursor:pointer; animation:rise 1.1s cubic-bezier(.2,.9,.3,1.12) both; animation-delay:var(--delay); border-radius:40px}
.balloon .bob{display:block; width:100%; height:100%; animation:bob var(--dur) ease-in-out var(--neg) infinite; transform-origin:50% 90%}
.balloon svg{width:100%; height:100%; display:block; overflow:visible}
@keyframes rise{0%{transform:translateY(130%); opacity:0} 100%{transform:none; opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-9px) rotate(4deg)}}
.balloon.popped{animation:pop .2s ease-in forwards; pointer-events:none}
@keyframes pop{0%{transform:scale(1)} 60%{transform:scale(1.28)} 100%{transform:scale(1.45); opacity:0}}
.note{position:absolute; inset:8px 2px 4px; display:grid; place-items:center; overflow:auto; padding:12px 9px 10px; border:2px solid var(--ink); border-radius:12px; box-shadow:0 3px 0 var(--ink);
  background:color-mix(in srgb, var(--c) 28%, var(--paper)); font:400 clamp(16px, 4.3vw, 19px)/1.18 var(--hand); color:var(--ink); text-wrap:balance; overflow-wrap:anywhere;
  transform:rotate(var(--r)); animation:note-in .55s cubic-bezier(.3,1.5,.5,1) both}
.note.long{font-size:clamp(14px, 3.8vw, 16px)}
.note::before{content:""; position:absolute; top:-9px; left:50%; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--c); border:2px solid var(--ink)}
@keyframes note-in{0%{transform:scale(.3) rotate(calc(var(--r) * -4)); opacity:0} 100%{transform:scale(1) rotate(var(--r)); opacity:1}}

/* scene 4: gift */
.gift-stage{--gs:min(84vw, 320px, 46vh); position:relative; width:var(--gs); height:calc(var(--gs) * 1.08)}
.gift{position:absolute; left:50%; bottom:0; width:calc(var(--gs) * .74); aspect-ratio:220/200; transform:translateX(-50%); padding:0; border:0; background:none; cursor:pointer; z-index:2; border-radius:20px}
.gift svg{width:100%; height:100%; display:block; overflow:visible; transform-origin:50% 92%}
.gift.wiggle svg{animation:wiggle .5s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)} 20%{transform:rotate(-7deg) translateY(-6px)} 40%{transform:rotate(6deg)} 60%{transform:rotate(-4deg)} 80%{transform:rotate(3deg)}}
.gift .lid{transform-box:fill-box; transform-origin:50% 100%; transition:transform .8s cubic-bezier(.3,1.3,.6,1), opacity .45s ease .4s}
.gift.open{cursor:default}
.gift.open .lid{transform:translate(40px,-170px) rotate(26deg); opacity:0}
.gift .sparkle{transform-box:fill-box; transform-origin:center; animation:twinkle 1.6s ease-in-out infinite}
.gift .sparkle:nth-of-type(2n){animation-delay:-.8s}
@keyframes twinkle{0%,100%{transform:scale(.5); opacity:.4} 50%{transform:scale(1.15); opacity:1}}
.voucher{position:absolute; left:50%; top:2%; width:calc(var(--gs) * .98); z-index:1; opacity:0; transform:translate(-50%, 78%) scale(.45);
  transition:transform 1s cubic-bezier(.2,1.25,.3,1), opacity .25s;
  filter:drop-shadow(2.5px 0 0 var(--ink)) drop-shadow(-2.5px 0 0 var(--ink)) drop-shadow(0 2.5px 0 var(--ink)) drop-shadow(0 -2.5px 0 var(--ink)) drop-shadow(0 4px 0 var(--ink))}
.voucher.up{opacity:1; transform:translate(-50%,0) scale(1)}
.v-in{display:grid; grid-template-columns:minmax(0,1fr) 25%; min-height:calc(var(--gs) * .44); background:var(--butter); border-radius:14px;
  -webkit-mask:radial-gradient(circle 11px at 75% 0, #0000 97%, #000) top/100% 51% no-repeat, radial-gradient(circle 11px at 75% 100%, #0000 97%, #000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 11px at 75% 0, #0000 97%, #000) top/100% 51% no-repeat, radial-gradient(circle 11px at 75% 100%, #0000 97%, #000) bottom/100% 51% no-repeat}
.v-main{padding:14px 12px 14px 18px; display:flex; flex-direction:column; justify-content:center; gap:6px; text-align:left; min-width:0}
.v-eyebrow{font:600 11px/1 var(--display); letter-spacing:.16em; text-transform:uppercase; color:var(--cherry-dark)}
.v-title{font:700 clamp(18px, 5.2vw, 23px)/1.1 var(--display); color:var(--ink); text-wrap:balance; overflow-wrap:anywhere}
.v-note{font:400 clamp(17px, 4.6vw, 19px)/1.2 var(--hand); color:var(--ink-soft); overflow-wrap:anywhere}
.v-stub{border-left:2.5px dashed rgba(74,36,32,.5); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(255,255,255,.4)}
.v-stub .admit{writing-mode:vertical-rl; transform:rotate(180deg); font:700 13px/1 var(--display); letter-spacing:.16em; text-transform:uppercase}
.v-stub .no{font:600 11px/1 var(--display); color:var(--ink-soft); font-variant-numeric:tabular-nums}

/* scene 5: letter */
.scene-letter .stack{height:100%; margin:0 auto; justify-content:center; gap:18px}
.letter-wrap{position:relative; flex:0 1 auto; min-height:0; width:100%; display:flex; transform:rotate(-1deg); animation:letter-in .8s cubic-bezier(.2,1,.3,1) both}
@keyframes letter-in{0%{transform:translateY(60px) rotate(4deg); opacity:0} 100%{transform:rotate(-1deg); opacity:1}}
.tape{position:absolute; z-index:2; top:-13px; left:50%; width:112px; height:28px; margin-left:-56px; transform:rotate(-4deg); background:repeating-linear-gradient(45deg, rgba(134,200,255,.8) 0 8px, rgba(255,255,255,.7) 8px 16px); box-shadow:0 1px 2px rgba(74,36,32,.2)}
.letter{--lh:31px; position:relative; flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; text-align:left; border:2.5px solid var(--ink); border-radius:14px; box-shadow:0 5px 0 var(--ink);
  padding:30px 20px 24px 46px; font:400 21px/var(--lh) var(--hand); color:var(--ink); cursor:default;
  background-color:var(--paper); background-image:linear-gradient(90deg, transparent 31px, rgba(240,56,107,.38) 31px 33px, transparent 33px), linear-gradient(transparent calc(var(--lh) - 1.5px), rgba(134,200,255,.6) calc(var(--lh) - 1.5px));
  background-size:100% 100%, 100% var(--lh); background-origin:padding-box, content-box; background-attachment:local, local}
.letter p{margin:0 0 var(--lh)}
.letter .greet{font-size:24px}
.letter .closing{margin:0}
.letter .from{margin:0; font:700 25px/var(--lh) var(--display); color:var(--cherry); display:flex; align-items:center; gap:8px}
.letter .from svg{width:22px; height:22px; flex:none}
.w{opacity:0; transition:opacity .45s ease; transition-delay:calc(var(--i) * 38ms)}
.letter.reveal .w{opacity:1}
.letter.instant .w{transition-delay:0s}
.end-actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}

/* personalize sheet (only offered to the card's owner) */
.editor{position:fixed; inset:0; z-index:50; background:rgba(43,21,32,.5); display:flex; align-items:flex-end; justify-content:center; padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
.sheet{position:relative; display:flex; flex-direction:column; width:100%; max-width:560px; max-height:100%; background:var(--paper); border:2.5px solid var(--ink); border-bottom:0; border-radius:22px 22px 0 0; animation:sheet-in .35s cubic-bezier(.2,.9,.3,1)}
@keyframes sheet-in{from{transform:translateY(40px); opacity:0}}
.sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px max(18px, env(safe-area-inset-right,0px)) 6px max(18px, env(safe-area-inset-left,0px))}

.field textarea{min-height:180px; resize:vertical}
.field input:focus-visible,.field textarea:focus-visible{outline-offset:1px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:0 10px}
.reasons{display:grid; gap:8px; margin:6px 0 14px}
.reasons input{width:100%; font:400 19px/1.3 var(--hand); color:var(--ink); background:#fff; border:2px solid var(--ink); border-radius:12px; padding:8px 12px}
.sheet-foot{flex:none; display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:10px; border-top:2px dashed rgba(74,36,32,.25);
  padding:12px max(18px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(18px, env(safe-area-inset-left,0px))}
.save-status{flex:1 1 100%; margin:0; min-height:1.25em; font:400 18px/1.25 var(--hand); color:var(--ink-soft); text-align:left}

  sec.innerHTML = BUILD[n](DATA);
  ENTER[n](sec);
  sections.forEach((s, i) => { const on = i === n; s.classList.toggle('on', on); s.inert = !on; s.setAttribute('aria-hidden', on ? 'false' : 'true'); });
  if (prev >= 0 && prev !== n) { const old = sections[prev]; setTimeout(() => { if (current !== prev) old.innerHTML = ''; }, 800); }
  updateBunting(n);
  if (!first) { const t = $('.title', sec); if (t) setTimeout(() => { if (current === n) t.focus({preventScroll: true}); }, 700); }
}

const ENTER = [
  sec => { /* envelope */
    document.body.classList.remove('dark');
    sec.classList.remove('revealed');
    const env = $('#envelope', sec), greeting = $('#greeting', sec), next = $('#envNext', sec);
    env.addEventListener('click', async () => {
      if (env.classList.contains('opening')) return;
      const hadFocus = document.activeElement === env;
      sound.unlock(); sound.bloop();
      env.classList.add('opening'); $('#envHint', sec).style.opacity = '0';
      await wait(320); env.classList.add('flap-open'); sound.whoosh();
      await wait(560); env.classList.add('flap-behind', 'letter-out');
      await wait(900); if (current !== 0) return;
      sec.classList.add('revealed'); greeting.setAttribute('aria-hidden', 'false');
      await wait(500); if (current !== 0) return;
      fx.cannons(); sound.chime();
      const r = $('.greet-card', sec).getBoundingClientRect();
      fx.sparkle(r.left + r.width / 2, r.top + 8, 22);
      await wait(1700); if (current !== 0) return;
      next.classList.add('show'); if (hadFocus) next.focus();
    });
    next.addEventListener('click', () => go(1));
  },
  sec => { /* cake */
    const wrap = $('#cakeWrap', sec), candles = $$('.candle', wrap);
    let done = false, down = false;
    setLit(wrap, 1);
    document.body.classList.add('dark');
    candles.forEach((c, i) => setTimeout(() => { if (current === 1 && sections[1].contains(c)) { c.classList.remove('unlit'); sound.fwip(); } }, 1100 + i * 260));
    const blow = c => {
      if (done || c.classList.contains('unlit') || c.classList.contains('out')) return;
      c.classList.add('out'); c.setAttribute('aria-label', 'Candle blown out'); sound.blow();
      const left = candles.filter(x => !x.classList.contains('out')).length;
      setLit(wrap, left / candles.length);
      if (left === 0) celebrate();
    };
    const at = (x, y) => { const el = document.elementFromPoint(x, y), c = el && el.closest ? el.closest('.candle') : null; if (c && wrap.contains(c)) blow(c); };
    wrap.addEventListener('pointerdown', e => { down = true; at(e.clientX, e.clientY); });
    wrap.addEventListener('pointermove', e => { if (down || e.pointerType === 'touch') at(e.clientX, e.clientY); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => wrap.addEventListener(t, () => { down = false; }));
    candles.forEach(c => c.addEventListener('click', () => blow(c)));
    async function celebrate() {
      done = true;
      const hint = $('#cakeHint', sec), title = $('#cakeTitle', sec);
      hint.style.opacity = '0';
      await wait(950); if (current !== 1) return;
      const b = document.body;
      b.classList.add('instant'); b.classList.remove('dark'); await wait(70); b.classList.add('dark'); await wait(110); b.classList.remove('dark');
      await wait(30); b.classList.remove('instant');
      wrap.classList.add('happy');
      fx.cannons(); sound.song();
      const text = 'Your wish is on its way!';
      title.setAttribute('aria-label', text); title.innerHTML = lettersHtml(text);
      hint.textContent = `Lights on! Happy birthday, ${DATA.name} 💛`; hint.style.opacity = '1';
      await wait(1500); fx.rain(60);
      $('#cakeNext', sec).classList.add('show');
    }
    $('#cakeNext', sec).addEventListener('click', () => go(2));
  },
  sec => { /* balloons */
    document.body.classList.remove('dark');
    let popped = 0;
    const next = $('#balloonNext', sec);
    $$('.balloon', sec).forEach(b => b.addEventListener('click', () => {
      if (b.classList.contains('popped')) return;
      const hadFocus = document.activeElement === b, cell = b.parentElement, r = b.getBoundingClientRect();
      b.classList.add('popped'); sound.pop();
      fx.pop(r.left + r.width / 2, r.top + r.height * .33, cell.style.getPropertyValue('--c').trim() || C.cherry);
      popped++; $('#popCount', sec).textContent = `${popped} of 6 popped`;
      setTimeout(() => {
        b.hidden = true; $('.note', cell).hidden = false;
        if (hadFocus) { const n = $$('.balloon', sec).find(x => !x.classList.contains('popped')); if (n) n.focus(); }
      }, 170);
      if (popped === 6) setTimeout(() => { sound.chime(); fx.rain(50); next.classList.add('show'); if (hadFocus) next.focus(); }, 800);
    }));
    next.addEventListener('click', () => go(3));
  },
  sec => { /* gift */
    let taps = 0;
    const gift = $('#gift', sec), hint = $('#giftHint', sec), lines = ['Tap the box to unwrap it', 'Ooh, something rattles…', 'One more tap!'];
    gift.addEventListener('click', async () => {
      if (gift.classList.contains('open')) return;
      taps++;
      if (taps < 3) { gift.classList.remove('wiggle'); void gift.offsetWidth; gift.classList.add('wiggle'); sound.tick(); hint.textContent = lines[taps]; return; }
      gift.classList.add('open'); gift.setAttribute('aria-label', 'Gift unwrapped'); hint.textContent = 'It’s all yours!';
      const r = gift.getBoundingClientRect();
      sound.chime(); fx.sparkle(r.left + r.width / 2, r.top + r.height * .3, 22); fx.burst(r.left + r.width / 2, r.top + r.height * .35, 60, {speed: 720, spread: 1.5});
      await wait(380); const v = $('#voucher', sec); v.classList.add('up'); v.setAttribute('aria-hidden', 'false');
      await wait(1300); $('#giftNext', sec).classList.add('show');
    });
    $('#giftNext', sec).addEventListener('click', () => go(4));
  },
  sec => { /* letter */
    const letter = $('#letter', sec), end = $('#endActions', sec), count = $$('.w', letter).length;
    let finished = false;
    const finish = () => {
      if (finished || current !== 4) return; finished = true;
      fx.show(4); sound.chime();
      setTimeout(() => { fx.rain(70); end.classList.add('show'); }, 900);
    };
    const t1 = setTimeout(() => letter.classList.add('reveal'), 750);
    const t2 = setTimeout(finish, 750 + (count + 6) * 38 + 600);
    /* keep the newest words in view while the letter writes itself, until the reader scrolls on their own */
    const ws = $$('.w', letter), startAt = performance.now() + 750;
    let follow = true;
    ['wheel', 'touchstart', 'pointerdown', 'keydown'].forEach(t => letter.addEventListener(t, () => { follow = false; }, {passive: true}));
    const step = now => {
      if (!follow || current !== 4 || !letter.isConnected) return;
      const idx = Math.min(ws.length - 1, Math.floor((now - startAt) / 38));
      if (idx >= 0) {
        const w = ws[idx], target = w.offsetTop + w.offsetHeight + 44 - letter.clientHeight;
        if (target > letter.scrollTop) letter.scrollTop += Math.max(1, Math.min(7, (target - letter.scrollTop) * .12));
      }
      if (idx < ws.length - 1 || letter.scrollTop < letter.scrollHeight - letter.clientHeight - 2) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    letter.addEventListener('click', () => {
      if (finished) return;
      clearTimeout(t1); clearTimeout(t2); letter.classList.add('instant', 'reveal'); setTimeout(finish, 500);
    });
    $('#againBtn', sec).addEventListener('click', () => { sound.unlock(); fx.cannons(); fx.show(3); sound.song(); });
    $('#restartBtn', sec).addEventListener('click', () => go(0));
  }
];

function mount() {
  document.title = `Happy Birthday, ${DATA.name}!`;
  document.body.classList.remove('dark');
  const app = document.getElementById('app');
  app.innerHTML = topbarHtml() + LABELS.map((l, i) => `<section class="scene scene-${['env', 'cake', 'balloons', 'gift', 'letter'][i]}" aria-label="${l}"></section>`).join('');
  sections = $$('.scene', app);
  current = -1;
  $('#soundBtn').addEventListener('click', e => {
    const on = sound.toggle(), b = e.currentTarget;
    b.innerHTML = on ? ICON.soundOn : ICON.soundOff; b.setAttribute('aria-pressed', String(on));
  });
  const eb = $('#editBtn'); eb.hidden = !canEditCard; eb.addEventListener('click', openEditor);
  document.body.classList.add('instant');
  go(0, true);
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('instant')));
}

/* ---------- personalize (owner only) ---------- */
async function checkOwner() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const user = await window.claude.use('user');
    if (!user) return;
    canEditCard = !!((await user.canEdit()) || (await user.isOwner()));
    const eb = $('#editBtn'); if (eb) eb.hidden = !canEditCard;
  } catch (e) { /* stays hidden */ }
}
function buildDocument(data) {
  const S = 'script';
  const style = document.getElementById('card-style').textContent;
  const script = document.getElementById('card-script').textContent;
  const json = JSON.stringify(data, null, 2).replace(/</g, '\\u003c');
  return SKELETON[0] + HEAD_BITS + '<style id="card-style">' + style + '</style>\n<div id="app"></div>\n<' + S + ' type="application/json" id="card-data">\n' + json + '\n</' + S + '>\n<' + S + ' id="card-script">' + script + '</' + S + '>' + SKELETON[1];
}
function openEditor() {
  if ($('#editor')) return;
  const d = DATA, box = document.createElement('div');
  box.className = 'editor'; box.id = 'editor';
  box.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <div class="sheet-head"><div><h2 id="edTitle">Personalize the card</h2><p>Only you can see this button. Your friend just gets the card.</p></div>
      <button class="close-x" id="edClose" type="button" aria-label="Close">${ICON.close}</button></div>
    <form class="sheet-body" id="edForm" novalidate>
      <div class="two">
        <div class="field"><label for="ed-name">Friend’s name</label><input id="ed-name" maxlength="40" autocomplete="off" value="${esc(d.name)}"></div>
        <div class="field"><label for="ed-from">Your name</label><input id="ed-from" maxlength="40" autocomplete="off" value="${esc(d.from)}"></div>
      </div>
      <div class="field"><label for="ed-message">Birthday message</label><textarea id="ed-message" maxlength="2000">${esc(d.message)}</textarea></div>
      <div class="field"><label for="ed-signoff">Sign-off</label><input id="ed-signoff" maxlength="40" value="${esc(d.signoff)}"></div>
      <p class="group-label" id="edReasons">Balloon notes</p>
      <div class="reasons" role="group" aria-labelledby="edReasons">${d.reasons.map((r, i) => `<input id="ed-r${i}" maxlength="80" aria-label="Balloon note ${i + 1}" value="${esc(r)}">`).join('')}</div>
      <div class="field"><label for="ed-gtitle">Gift voucher</label><input id="ed-gtitle" maxlength="60" value="${esc(d.giftTitle)}"></div>
      <div class="field"><label for="ed-gnote">Voucher fine print</label><input id="ed-gnote" maxlength="90" value="${esc(d.giftNote)}"></div>
    </form>
    <div class="sheet-foot"><p class="save-status" id="edStatus" role="status"></p>
      <button class="btn quiet" id="edPreview" type="button">Preview</button>
      <button class="btn" id="edSave" type="button">Save card</button></div></div>`;
  document.body.appendChild(box);
  const collect = () => normalize({
    name: $('#ed-name').value, from: $('#ed-from').value, signoff: $('#ed-signoff').value,
    message: $('#ed-message').value.replace(/\r\n?/g, '\n'), giftTitle: $('#ed-gtitle').value, giftNote: $('#ed-gnote').value,
    reasons: DEFAULTS.reasons.map((_, i) => $('#ed-r' + i).value)
  });
  const close = () => { box.remove(); document.removeEventListener('keydown', onKey); const eb = $('#editBtn'); if (eb) eb.focus(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  box.addEventListener('click', e => { if (e.target === box) close(); });
  $('#edClose').addEventListener('click', close);
  $('#edForm').addEventListener('submit', e => e.preventDefault());
  $('#edPreview').addEventListener('click', () => { DATA = collect(); close(); mount(); });
  $('#edSave').addEventListener('click', async () => {
    const st = $('#edStatus'), btn = $('#edSave'), data = collect();
    st.className = 'save-status'; st.textContent = 'Saving…'; btn.disabled = true;
    const publish = async () => {
      const art = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('artifact') : null;
      if (!art) throw {code: 'not_granted'};
      return art.publish(buildDocument(data));
    };
    try {
      try { await publish(); }
      catch (e) { if (e && e.code === 'upstream_error') { await wait(rand(700, 1400)); await publish(); } else throw e; }
      DATA = data; st.textContent = 'Saved! The card is reloading with your changes.';
    } catch (e) {
      const code = e && e.code;
      const readOnly = ['not_writer', 'not_granted', 'not_declared', 'capability_disabled', 'capability_removed', 'consent_required'];
      st.textContent = ({
        conflict: 'A newer version was saved first, so the card is reloading. Make your edits again once it loads.',
        too_large: 'That’s more text than the card can hold. Try a shorter message.',
        rate_limited: 'Saving too quickly. Wait a minute, then try again.',
        invalid_content: 'Something in the text couldn’t be saved. Try removing unusual characters.'
      })[code] || (readOnly.includes(code) ? 'Saving isn’t available in this view. Open the card in your Claude app, or ask Claude to update it.' : 'Couldn’t save just now. Check your connection and try again.');
      st.classList.add('bad'); btn.disabled = false;
    }
  });
  setTimeout(() => $('#ed-name').focus(), 60);
}

/* ---------- boot ---------- */
function boot() {
  drawSprinkles(); fx.init(); mount(); checkOwner();
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { drawSprinkles(); fx.resize(); }, 160); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
